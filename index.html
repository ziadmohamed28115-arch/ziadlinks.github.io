<style>
:root{--bg:#f1f3f6;--card:#ffffff;--text:#101828;--muted:#667085;--border:#e2e5ea;--ring:#101828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#181c23;--text:#f2f4f7;--muted:#98a2b3;--border:#272c36;--ring:#f2f4f7}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#181c23;--text:#f2f4f7;--muted:#98a2b3;--border:#272c36;--ring:#f2f4f7}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:40px 20px 32px;text-align:center}
.avatar{width:112px;height:112px;border-radius:50%;margin:0 auto 16px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:48px;font-weight:900;overflow:hidden;border:4px solid var(--card);box-shadow:0 0 0 2px var(--border)}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{margin:0;font-size:28px;font-weight:900;line-height:1.3;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px}
h1 .ar{direction:rtl}
p.sub{margin:6px 0 28px;color:var(--muted);font-size:16px}
nav{display:flex;flex-direction:column;gap:12px}
a.link{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:16px;color:var(--text);text-decoration:none;font-size:18px;font-weight:700;text-align:start;transition:transform .15s,border-color .15s}
a.link:hover{transform:translateY(-2px);border-color:var(--muted)}
a.link:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico svg{width:24px;height:24px;fill:#fff}
.go{margin-inline-start:auto;color:var(--muted);font-size:24px;line-height:1}
footer{margin-top:32px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion: reduce){a.link{transition:none}}
</style>
