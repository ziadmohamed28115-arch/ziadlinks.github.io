<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ziad Mohamed - زياد محمد | كل حساباتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--bg:#eef1f8;--glass:rgba(255,255,255,.66);--gb:rgba(255,255,255,.95);--text:#0f172a;--muted:#475569;--a1:#7dd3fc;--a2:#f9a8d4;--a3:#fde68a;--dot:rgba(15,23,42,.35);--ring:#0f172a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#070a12;--glass:rgba(255,255,255,.07);--gb:rgba(255,255,255,.15);--text:#f1f5f9;--muted:#a3adc2;--a1:#1d4ed8;--a2:#be185d;--a3:#0f766e;--dot:rgba(255,255,255,.6);--ring:#f1f5f9}}
:root[data-theme="dark"]{--bg:#070a12;--glass:rgba(255,255,255,.07);--gb:rgba(255,255,255,.15);--text:#f1f5f9;--muted:#a3adc2;--a1:#1d4ed8;--a2:#be185d;--a3:#0f766e;--dot:rgba(255,255,255,.6);--ring:#f1f5f9}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center;align-items:center;overflow-x:hidden}
.au{position:fixed;border-radius:50%;filter:blur(60px);opacity:.6;pointer-events:none;z-index:0}
.au1{width:320px;height:320px;top:-100px;right:-80px;background:var(--a1)}
.au2{width:300px;height:300px;bottom:-90px;left:-90px;background:var(--a2)}
.au3{width:240px;height:240px;top:42%;left:38%;background:var(--a3);opacity:.32}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;width:100%;max-width:440px;padding:12px 16px 16px;text-align:center}
.ring{position:relative;isolation:isolate;width:100px;height:100px;margin:0 auto 8px;padding:4px;border-radius:50%}
.ring::before,.ring::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#ff0050,#ffb800,#25f4ee,#1877f2,#ff0050)}
.ring::after{inset:-4px;filter:blur(14px);opacity:.55;z-index:-1}
.avatar{position:relative;width:100%;height:100%;border-radius:50%;border:4px solid var(--bg);background:var(--text);color:var(--bg);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin:0;font-size:24px;font-weight:900;line-height:1.3;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 10px}
h1 .ar{direction:rtl}
h1 .en{background:linear-gradient(90deg,var(--text),#38bdf8,#f472b6,var(--text));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{margin:2px 0 14px;color:var(--muted);font-size:14px;min-height:1.7em}
#tg::after{content:"";display:inline-block;width:2px;height:1em;margin-inline-start:3px;vertical-align:-2px;background:var(--muted)}
nav{display:flex;flex-direction:column;gap:8px}
a.link{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:7px 12px;background:var(--glass);border:1px solid var(--gb);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 8px 24px rgba(0,0,0,.12);border-radius:16px;color:var(--text);text-decoration:none;font-size:16px;font-weight:700;text-align:start;transition:transform .2s ease-out}
a.link:hover{transform:translateY(-2px)}
a.link:active{transform:scale(.98)}
a.link:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
a.link::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--c) 40%,transparent),transparent 70%);opacity:0;transition:opacity .25s;pointer-events:none}
a.link:hover::before,a.link:active::before{opacity:1}
a.link>.ico,a.link>.stext,a.link>.go,a.link>.pay{position:relative}
.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--c);box-shadow:0 6px 16px color-mix(in srgb,var(--c) 45%,transparent)}
.ico svg{width:22px;height:22px;fill:#fff}
.go{margin-inline-start:auto;color:var(--muted);font-size:22px;line-height:1}
.tk .ico{background:#010101;box-shadow:2px 2px 0 #fe2c55,-2px -2px 0 #25f4ee}
.ig .ico{background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4)}
.support{--c:#12b886;border:2px solid transparent;color:#fff;padding:8px 12px;background:linear-gradient(135deg,#052e22,#0b6b4d) padding-box,conic-gradient(from var(--a),#ffd166,#12b886,#fff3bf,#12b886,#ffd166) border-box}
.support .ico{background:rgba(255,255,255,.16);box-shadow:none}
.support .ico svg{fill:#ffd166}
.stext{display:block;line-height:1.35}
.stext strong{display:block;font-size:15px;font-weight:900}
.stext small{display:block;font-size:12.5px;font-weight:400;opacity:.95}
.pay{margin-inline-start:auto;flex:none;background:#fff;color:#064e3b;font:900 12px system-ui,sans-serif;padding:5px 10px;border-radius:999px;direction:ltr}
.fh{position:absolute;bottom:2px;color:#ffd166;font-size:11px;font-style:normal;opacity:0;pointer-events:none}
footer{margin-top:12px;color:var(--muted);font-size:12px}
@media (max-height:720px){.ring{width:86px;height:86px}h1{font-size:22px}p.sub{margin-bottom:10px}a.link{padding:5px 12px}.support{padding:6px 12px}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes ang{to{--a:360deg}}
@keyframes grad{to{background-position:-300% 0}}
@keyframes blink{50%{opacity:0}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(30px,40px)}}
@keyframes fh{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.9}100%{transform:translateY(-50px) scale(1.1);opacity:0}}
@media (prefers-reduced-motion: no-preference){
.ring{animation:pop .7s cubic-bezier(.2,.9,.3,1.3) backwards,bob 5s ease-in-out .8s infinite}
.ring::before,.ring::after{animation:spin 7s linear infinite}
h1{animation:rise .6s .2s backwards}
h1 .en{animation:grad 6s linear infinite}
p.sub{animation:rise .6s .3s backwards}
#tg::after{animation:blink 1s steps(1) infinite}
a.link{animation:rise .55s var(--d,.4s) backwards}
a.link:nth-child(1){--d:.4s}a.link:nth-child(2){--d:.5s}a.link:nth-child(3){--d:.6s}a.link:nth-child(4){--d:.7s}a.link:nth-child(5){--d:.8s}
.support{animation:rise .55s .95s backwards,ang 4s linear infinite}
.fh{animation:fh 3.2s ease-in infinite}
.au{animation:drift 14s ease-in-out infinite alternate}
.au2{animation-duration:18s;animation-direction:alternate-reverse}
footer{animation:rise .6s 1.1s backwards}
}
</style>
</head>
